name: .NET CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_debug:
        description: "Запустити Debug build?"
        required: true
        default: "false"
        type: boolean
      run_release:
        description: "Запустити Release build?"
        required: true
        default: "true"
        type: boolean
      release_message:
        description: "Повідомлення для релізу (лише для Release)"
        required: false

jobs:
  setup:
    runs-on: windows-2022
    outputs:
      temp_branch: ${{ steps.set_branch.outputs.temp_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create temp branch (only for manual runs)
        id: set_branch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          $branch = "ci-build-${{ github.run_number }}"
          git checkout -B $branch
          git push origin $branch --force
          echo "temp_branch=$branch" >> $env:GITHUB_OUTPUT

  build-debug:
    if: ${{ github.event.inputs.run_debug == 'true' }}
    needs: setup
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - run: dotnet restore
      - run: dotnet build --configuration Debug --no-restore
      - run: dotnet test --configuration Debug --no-build --verbosity normal
      - uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_number }}
          path: "**/bin/Debug/**"

  build-release:
    if: ${{ github.event.inputs.run_release == 'true' || github.event_name == 'push' }}
    needs: setup
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Publish Release
        run: dotnet publish --configuration Release -o out

      - name: Package ZIP
        run: |
          mkdir package
          xcopy /E /I /Y out package\
          powershell -Command "Compress-Archive -Path package\* -DestinationPath out/TuneForge.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.run_number }}
          path: out

      - name: Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "TuneForge Release #${{ github.run_number }}"
          body: |
            • Commit: ${{ github.sha }}
            • Message: ${{ github.event.inputs.release_message || 'Manual release' }}
          files: out/TuneForge.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [build-debug, build-release]
    runs-on: windows-2022
    steps:
      - name: Delete temp branch
        shell: pwsh
        run: |
          if ("${{ needs.setup.outputs.temp_branch }}") {
            git push origin --delete ${{ needs.setup.outputs.temp_branch }}
          }
