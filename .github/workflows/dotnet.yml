name: Build-Windows

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (${{ matrix.config }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.1

      - name: Restore dependencies
        run: dotnet restore WpfTuneForgePlayer.sln

      - name: Build solution
        run: msbuild WpfTuneForgePlayer.sln /p:Configuration=${{ matrix.config }} /p:Platform="Any CPU"

      - name: Run tests
        run: dotnet test WpfTuneForgePlayer.sln --no-build --configuration ${{ matrix.config }} --verbosity normal

      - name: Package build (zip)
        if: matrix.config == 'Release'
        shell: pwsh
        run: |
          mkdir package
          Copy-Item -Recurse -Force "bin\Release\net8.0-windows" package\
          Compress-Archive -Path package\* -DestinationPath TuneForge-${{ matrix.config }}.zip

      - name: Upload artifact
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: TuneForge-${{ matrix.config }}
          path: TuneForge-${{ matrix.config }}.zip

  release:
    name: Create GitHub Release
    runs-on: windows-2022
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: TuneForge-Release
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          name: "TuneForge Release #${{ github.run_number }}"
          body: |
            • Commit: ${{ github.sha }}
            • Automatic Windows build
          files: artifacts/TuneForge-Release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
