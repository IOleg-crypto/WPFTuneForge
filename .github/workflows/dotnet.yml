name: .NET TuneForge

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '*.txt'
      - '*.png'

  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Optional: Commit SHA to checkout (defaults to current HEAD)'
        required: false
      release_message:
        description: 'Message to include in the release'
        required: true

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.commit_sha || github.sha }}
        fetch-depth: 0

    - name: Push commit to temp branch (to trigger checks)
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        BRANCH="ci-build-${{ github.run_number }}"
        git checkout -B $BRANCH
        git push origin $BRANCH --force

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.411

    - name: Restore dependencies
      run: dotnet restore WpfTuneForgePlayer.sln

    - name: Build with MSBuild (required for WPF)
      uses: microsoft/setup-msbuild@v1.1
    - run: msbuild WpfTuneForgePlayer.sln /p:Configuration=Release /p:PreferredToolArchitecture=x64 /m

    - name: Test
      run: dotnet test WpfTuneForgePlayer.sln --no-build --configuration Release --verbosity normal

    - name: Create ZIP package with .exe and assets/
      run: |
        mkdir package
        xcopy /E /I /Y bin\Release\assets package\assets
        xcopy /Y bin\Release\*.dll package\
        xcopy /Y bin\Release\*.pdb package\
        xcopy /Y bin\Release\*.xml package\
        xcopy /Y bin\Release\WpfTuneForgePlayer.exe package\
        powershell -Command "Compress-Archive -Path package\* -DestinationPath bin\Release\TuneForge.zip"

    - name: List ZIP content
      run: powershell -Command "Expand-Archive -Path bin\Release\TuneForge.zip -DestinationPath test_extract; dir test_extract -Recurse"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.run_number }}
        target_commitish: ${{ github.event.inputs.commit_sha || github.sha }}
        name: "TuneForge Release #${{ github.run_number }}"
        body: |
          • Commit: ${{ github.event.inputs.commit_sha || github.sha }}
          • Message: ${{ github.event.inputs.release_message || 'Manual release' }}
        files: bin/Release/TuneForge.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Delete temp branch
      if: always()
      run: |
        BRANCH="ci-build-${{ github.run_number }}"
        git push origin --delete $BRANCH || echo "No branch to delete"
