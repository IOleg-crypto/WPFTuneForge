name: .NET TuneForge

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '*.txt'
      - '*.png'

  workflow_dispatch:
    inputs:
      run_build:
        description: 'Run build?'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      run_tests:
        description: 'Run tests?'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      run_release:
        description: 'Create release package?'
        required: true
        default: 'false'
        type: choice
        options: ['true', 'false']
      commit_sha:
        description: 'Commit SHA to build (defaults to HEAD)'
        required: false
      release_message:
        description: 'Release message (used if creating release)'
        required: false

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.commit_sha || github.sha }}
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1

    # --- BUILD ---
    - name: Build solution
      if: ${{ github.event_name == 'push' || github.event.inputs.run_build == 'true' }}
      run: msbuild WpfTuneForgePlayer.sln /p:Configuration=Release /p:PreferredToolArchitecture=x64 /m

    # --- TESTS ---
    - name: Run xUnit tests
      if: ${{ github.event_name == 'push' || github.event.inputs.run_tests == 'true' }}
      run: dotnet test WpfTuneForgePlayer.sln --no-build --configuration Release --verbosity normal

    # --- PACKAGE ---
    - name: Create ZIP package
      if: ${{ github.event_name == 'push' || github.event.inputs.run_release == 'true' }}
      run: |
        mkdir package
        xcopy /E /I /Y bin\Release\assets package\assets
        xcopy /Y bin\Release\*.dll package\
        xcopy /Y bin\Release\*.pdb package\
        xcopy /Y bin\Release\*.xml package\
        xcopy /Y bin\Release\WpfTuneForgePlayer.exe package\
        Compress-Archive -Path package\* -DestinationPath bin\Release\TuneForge.zip

    # --- RELEASE ---
    - name: Create GitHub Release
      if: ${{ github.event_name == 'push' || github.event.inputs.run_release == 'true' }}
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.run_number }}
        target_commitish: ${{ github.event.inputs.commit_sha || github.sha }}
        name: "TuneForge Release #${{ github.run_number }}"
        body: |
          • Commit: ${{ github.event.inputs.commit_sha || github.sha }}
          • Message: ${{ github.event.inputs.release_message || 'Manual release' }}
        files: bin/Release/TuneForge.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
