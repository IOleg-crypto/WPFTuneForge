name: .NET TuneForge

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '*.txt'
      - '*.png'

  workflow_dispatch:
    inputs:
      run_build:
        description: 'Run build?'
        required: true
        default: 'true'
        type: boolean
      run_tests:
        description: 'Run tests?'
        required: true
        default: 'true'
        type: boolean
      run_release:
        description: 'Create release package?'
        required: true
        default: 'false'
        type: boolean
      commit_sha:
        description: 'Commit SHA to build (defaults to HEAD)'
        required: false
      release_message:
        description: 'Release message (used if creating release)'
        required: false

jobs:
  build_and_test:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.commit_sha || github.sha }}
        fetch-depth: 0

    # Push temporary branch for workflow_dispatch to show statuses
    - name: Push temp branch for workflow_dispatch
      if: github.event_name == 'workflow_dispatch'
      shell: pwsh
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        $branch = "ci-build-${{ github.run_number }}"
        git checkout -B $branch
        git push origin $branch --force

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.411

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1

    # Determine actions (PowerShell syntax)
    - name: Determine actions
      shell: pwsh
      run: |
        if ("${{ github.event_name }}" -eq "push") {
            "run_build=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "run_tests=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "run_release=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        } else {
            "run_build=${{ github.event.inputs.run_build }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "run_tests=${{ github.event.inputs.run_tests }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "run_release=${{ github.event.inputs.run_release }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        }

    - name: Build solution
      if: env.run_build -eq 'true' -or env.run_tests -eq 'true'
      shell: pwsh
      run: msbuild WpfTuneForgePlayer.sln /p:Configuration=Release /p:PreferredToolArchitecture=x64 /m

    - name: Run xUnit tests
      if: env.run_tests -eq 'true'
      shell: pwsh
      run: dotnet test WpfTuneForgePlayer.sln --no-build --configuration Release --verbosity normal

    - name: Create ZIP package
      if: env.run_release -eq 'true'
      shell: pwsh
      run: |
        mkdir package
        xcopy /E /I /Y bin\Release\assets package\assets
        xcopy /Y bin\Release\*.dll package\
        xcopy /Y bin\Release\*.pdb package\
        xcopy /Y bin\Release\*.xml package\
        xcopy /Y bin\Release\WpfTuneForgePlayer.exe package\
        Compress-Archive -Path package\* -DestinationPath bin\Release\TuneForge.zip

    - name: Create GitHub Release
      if: env.run_release -eq 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.run_number }}
        target_commitish: ${{ github.event.inputs.commit_sha || github.sha }}
        name: "TuneForge Release #${{ github.run_number }}"
        body: |
          • Commit: ${{ github.event.inputs.commit_sha || github.sha }}
          • Message: ${{ github.event.inputs.release_message || 'Manual release' }}
        files: bin/Release/TuneForge.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Delete temporary branch
    - name: Delete temp branch
      if: github.event_name == 'workflow_dispatch'
      shell: pwsh
      run: |
        $branch = "ci-build-${{ github.run_number }}"
        git push origin --delete $branch || Write-Host "No branch to delete"
