name: .NET TuneForge

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '*.txt'
      - '*.png'

  workflow_dispatch:
    inputs:
      run_build:
        description: 'Run build?'
        required: true
        default: 'true'
        type: boolean
      run_tests:
        description: 'Run tests?'
        required: true
        default: 'true'
        type: boolean
      run_release:
        description: 'Create release package?'
        required: true
        default: 'false'
        type: boolean
      commit_sha:
        description: 'Commit SHA to build (defaults to HEAD)'
        required: false
      release_message:
        description: 'Release message (used if creating release)'
        required: false

jobs:
  build_and_test:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.commit_sha || github.sha }}
        fetch-depth: 0

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.411

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1

    # Визначаємо, що робити
    - name: Determine actions
      id: actions
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          echo "run_build=true" >> $GITHUB_ENV
          echo "run_tests=true" >> $GITHUB_ENV
          echo "run_release=true" >> $GITHUB_ENV
        else
          echo "run_build=${{ github.event.inputs.run_build }}" >> $GITHUB_ENV
          echo "run_tests=${{ github.event.inputs.run_tests }}" >> $GITHUB_ENV
          echo "run_release=${{ github.event.inputs.run_release }}" >> $GITHUB_ENV
        fi

    - name: Build solution
      if: env.run_build == 'true' || env.run_tests == 'true'
      run: msbuild WpfTuneForgePlayer.sln /p:Configuration=Release /p:PreferredToolArchitecture=x64 /m

    - name: Run xUnit tests
      if: env.run_tests == 'true'
      run: dotnet test WpfTuneForgePlayer.sln --no-build --configuration Release --verbosity normal

    - name: Create ZIP package
      if: env.run_release == 'true'
      run: |
        mkdir package
        xcopy /E /I /Y bin\Release\assets package\assets
        xcopy /Y bin\Release\*.dll package\
        xcopy /Y bin\Release\*.pdb package\
        xcopy /Y bin\Release\*.xml package\
        xcopy /Y bin\Release\WpfTuneForgePlayer.exe package\
        powershell -Command "Compress-Archive -Path package\* -DestinationPath bin\Release\TuneForge.zip"

    - name: Create GitHub Release
      if: env.run_release == 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.run_number }}
        target_commitish: ${{ github.event.inputs.commit_sha || github.sha }}
        name: "TuneForge Release #${{ github.run_number }}"
        body: |
          • Commit: ${{ github.event.inputs.commit_sha || github.sha }}
          • Message: ${{ github.event.inputs.release_message || 'Manual release' }}
        files: bin/Release/TuneForge.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
