name: MSBuild TuneForge

on:
  workflow_dispatch:
    inputs:
      build_config:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release
      run_tests:
        description: 'Run tests?'
        required: true
        default: 'true'
        type: boolean
      run_release:
        description: 'Create release package?'
        required: true
        default: 'false'
        type: boolean
      commit_sha:
        description: 'Commit SHA to build (defaults to HEAD)'
        required: false
      release_message:
        description: 'Release message (used if creating release)'
        required: false

jobs:
  build_and_test:
    runs-on: windows-2022
    env:
      TEMP_BRANCH: temp-build-${{ github.run_id }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.commit_sha || github.sha }}
        fetch-depth: 0

    - name: Create temporary branch
      run: |
        git checkout -B $env:TEMP_BRANCH
        echo "Temporary branch created: $env:TEMP_BRANCH"

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.411

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1

    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: |
          C:\Users\runneradmin\.nuget\packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.config') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Restore NuGet packages
      run: nuget restore WpfTuneForgePlayer.sln

    - name: Build solution
      run: msbuild WpfTuneForgePlayer.sln /p:Configuration=${{ github.event.inputs.build_config }} /p:Platform=AnyCPU /m

    - name: Run tests
      if: ${{ github.event.inputs.run_tests == 'true' }}
      run: |
        $testDll = "bin\${{ github.event.inputs.build_config }}\WpfTuneForge.Tests.dll"
        if (Test-Path $testDll) {
          & "C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\Common7\IDE\Extensions\TestPlatform\vstest.console.exe" $testDll
        } else {
          Write-Host "No test DLL found for configuration."
        }

    - name: Create ZIP packages
      if: ${{ github.event.inputs.run_release == 'true' }}
      run: |
        foreach ($cfg in @("Debug","Release")) {
          if (Test-Path "bin\$cfg") {
            mkdir "package_$cfg" -Force
            xcopy /E /I /Y "bin\$cfg\assets" "package_$cfg\assets"
            xcopy /Y "bin\$cfg\*.dll" "package_$cfg\"
            xcopy /Y "bin\$cfg\*.pdb" "package_$cfg\"
            xcopy /Y "bin\$cfg\*.xml" "package_$cfg\"
            xcopy /Y "bin\$cfg\WpfTuneForgePlayer.exe" "package_$cfg\"
            powershell -Command "Compress-Archive -Path package_$cfg\* -DestinationPath bin\$cfg\TuneForge_$cfg.zip"
          }
        }

    - name: Create GitHub Release
      if: ${{ github.event.inputs.run_release == 'true' }}
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.run_number }}
        target_commitish: ${{ github.event.inputs.commit_sha || github.sha }}
        name: "TuneForge Release #${{ github.run_number }}"
        body: |
          • Commit: ${{ github.event.inputs.commit_sha || github.sha }}
          • Message: ${{ github.event.inputs.release_message || 'Manual release' }}
        files: |
          bin/Debug/TuneForge_Debug.zip
          bin/Release/TuneForge_Release.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Delete temporary branch
      run: |
        git checkout main
        git branch -D $env:TEMP_BRANCH
        echo "Temporary branch deleted: $env:TEMP_BRANCH"
