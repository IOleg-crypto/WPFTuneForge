name: MSBuild TuneForge

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '**/*.txt'
      - '**/bin/**'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.bmp'
      - '**/*.svg'
  pull_request:
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '**/*.txt'
      - '**/bin/**'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.bmp'
      - '**/*.svg'
  workflow_dispatch:
    inputs:
      build_config:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release
      run_tests:
        description: 'Run tests?'
        required: true
        default: 'true'
        type: boolean
      run_release:
        description: 'Create release package?'
        required: true
        default: 'false'
        type: boolean
      commit_sha:
        description: 'Commit SHA to build (defaults to HEAD)'
        required: false
      release_message:
        description: 'Release message (used if creating release)'
        required: false

jobs:
  build_and_test:
    runs-on: windows-2022
    env:
      RUN_BUILD: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_build == 'true' }}
      RUN_TESTS: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_tests == 'true' }}
      RUN_RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_release == 'true' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ env.COMMIT_SHA }}
        fetch-depth: 0

    - name: Create temporary branch
      run: |
        git checkout -B $env:TEMP_BRANCH
        echo "Temporary branch created: $env:TEMP_BRANCH"

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.411

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      if: ${{ env.RUN_BUILD == 'true' || env.RUN_TESTS == 'true' || env.RUN_RELEASE == 'true' }}
      run: dotnet restore WpfTuneForgePlayer.sln

    - name: Build solution
      if: ${{ env.RUN_BUILD == 'true' || env.RUN_TESTS == 'true' }}
      run: msbuild WpfTuneForgePlayer.sln /p:Configuration=Release /p:PreferredToolArchitecture=x64 /m

    - name: Run tests
      if: ${{ env.RUN_TESTS == 'true' }}
      run: dotnet test WpfTuneForgePlayer.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults --verbosity normal

    - name: Publish test results
      if: ${{ always() && env.RUN_TESTS == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: TestResults
        path: TestResults
        if-no-files-found: warn

    - name: Create ZIP package
      if: ${{ env.RUN_RELEASE == 'true' }}
      run: |
        mkdir package
        xcopy /E /I /Y bin\Release\assets package\assets
        xcopy /Y bin\Release\*.dll package\
        xcopy /Y bin\Release\*.pdb package\
        xcopy /Y bin\Release\*.xml package\
        xcopy /Y bin\Release\WpfTuneForgePlayer.exe package\
        powershell -Command "Compress-Archive -Path package\* -DestinationPath bin\Release\TuneForge.zip"

    - name: Upload release package artifact
      if: ${{ always() && env.RUN_RELEASE == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: TuneForge-Release-${{ github.run_number }}
        path: bin/Release/TuneForge.zip
        if-no-files-found: error

    - name: Create GitHub Release
      if: ${{ env.RUN_RELEASE == 'true' }}
      uses: softprops/action-gh-release@v1
      with:
        tag_name: build-${{ github.run_number }}
        target_commitish: ${{ env.COMMIT_SHA }}
        name: "TuneForge Release #${{ github.run_number }}"
        body: |
          • Commit: ${{ env.COMMIT_SHA }}
          • Message: ${{ github.event.inputs.release_message || 'Manual release' }}
        files: |
          bin/Debug/TuneForge_Debug.zip
          bin/Release/TuneForge_Release.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Delete temporary branch
      run: |
        git checkout main
        git branch -D $env:TEMP_BRANCH
        echo "Temporary branch deleted: $env:TEMP_BRANCH"

    - name: Set commit status
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
          github.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: process.env.COMMIT_SHA,
            state: state,
            context: 'MSBuild TuneForge',
            description: `Workflow finished with status: ${state}`
          })
